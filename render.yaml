services:
  - type: web
    name: colorai-studio
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"

